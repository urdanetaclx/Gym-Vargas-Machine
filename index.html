<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Vargas Machine - Control de Miembros</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #ffffff; padding: 15px; text-align: center; }
    
    /* Logo de Mancuerna / Barra */
    .logo-container { display: flex; align-items: center; justify-content: center; margin: 20px 0; gap: 5px; }
    .disco { width: 12px; height: 45px; background: #d32f2f; border-radius: 3px; border: 1px solid #9a0007; }
    .disco-peq { width: 8px; height: 35px; background: #b71c1c; border-radius: 2px; }
    .agarre { width: 15px; height: 8px; background: #888; }
    .logo-texto { font-size: 1.1rem; font-weight: bold; color: #ffffff; letter-spacing: 1px; text-transform: uppercase; padding: 0 6px; }
    .logo-texto span { color: #d32f2f; }

    /* Tarjetas */
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 1px solid #333; }
    .card h2 { margin-bottom: 15px; font-size: 1.1rem; color: #e0e0e0; text-transform: uppercase; letter-spacing: 0.5px; }
    
    label { display: block; text-align: left; font-size: 0.85rem; color: #aaa; margin-bottom: 5px; font-weight: 600; }

    input[type="text"], input[type="tel"], input[type="date"], input[type="number"], select { 
      width: 100%; 
      padding: 14px; 
      margin-bottom: 15px; 
      border-radius: 8px; 
      border: 1px solid #444; 
      background: #2a2a2a; 
      color: #fff; 
      font-size: 1rem; 
      outline: none; 
      color-scheme: dark;
    }
    input:focus, select:focus { border-color: #d32f2f; }

    .resumen-pago {
      background: #282828;
      border: 1px solid #d32f2f;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      text-align: left;
    }
    .resumen-pago p { font-size: 0.9rem; color: #bbb; margin-bottom: 4px; }
    .resumen-pago strong { color: #fff; font-size: 1.1rem; }
    .monto-bs { color: #4caf50 !important; font-size: 1.2rem; }

    .checkbox-container { display: flex; align-items: center; background: #2a2a2a; padding: 12px 15px; border-radius: 8px; border: 1px solid #d32f2f; margin-bottom: 18px; cursor: pointer; }
    .checkbox-container input[type="checkbox"] { width: 22px; height: 22px; accent-color: #d32f2f; margin-right: 12px; cursor: pointer; }
    .checkbox-container label { margin-bottom: 0; color: #fff; font-size: 0.95rem; cursor: pointer; }

    button { width: 100%; padding: 15px; background: #d32f2f; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    button:active { background: #9a0007; transform: scale(0.98); }
    
    .btn-borrar { background: #333; color: #aaa; margin-top: 10px; font-size: 0.85rem; padding: 10px; border: 1px solid #444; }

    /* Estilos de miembros */
    .miembro-card { background: #2a2a2a; padding: 14px 15px; border-radius: 8px; margin-bottom: 10px; text-align: left; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #2e7d32; }
    .miembro-card.alerta-proximo { border-left-color: #f57c00; background: #332619; }
    .miembro-card.alerta-vencido { border-left-color: #d32f2f; background: #331919; }

    .miembro-info strong { display: block; font-size: 1.05rem; color: #fff; margin-bottom: 3px; }
    .miembro-info span { font-size: 0.85rem; color: #ff8a80; font-weight: 600; display: block; }
    .miembro-info small { font-size: 0.78rem; color: #aaa; }
    
    .badge-alerta { display: inline-block; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; margin-top: 4px; font-weight: bold; }
    .badge-warning { background: #f57c00; color: #fff; }
    .badge-danger { background: #d32f2f; color: #fff; }

    .monto-box { text-align: right; }
    .monto-tag { font-size: 0.95rem; font-weight: bold; padding: 4px 8px; border-radius: 6px; background: #2e7d32; color: #fff; white-space: nowrap; }
    .monto-sub-bs { font-size: 0.8rem; color: #81c784; font-weight: bold; margin-top: 3px; display: block; }
    
    /* Botones de Acción */
    .acciones-container { display: flex; align-items: center; gap: 6px; }
    .btn-ws { background: #25d366; color: white; border: none; padding: 8px 10px; border-radius: 6px; font-size: 1rem; cursor: pointer; text-decoration: none; }
    .btn-editar { background: #1976d2; color: white; border: none; padding: 8px 10px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; }
    .btn-eliminar-item { background: transparent; color: #ff5252; border: none; padding: 5px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>

  <!-- LOGO EMBEBIDO -->
  <div class="logo-container">
    <div class="disco-peq"></div>
    <div class="disco"></div>
    <div class="agarre"></div>
    <div class="logo-texto">GYM <span>VARGAS</span> MACHINE</div>
    <div class="agarre"></div>
    <div class="disco"></div>
    <div class="disco-peq"></div>
  </div>

  <!-- REGISTRO Y EDICIÓN -->
  <div class="card">
    <h2 id="tituloFormulario">Registrar Cliente</h2>
    
    <input type="hidden" id="editId">

    <label for="tasaBcv">💵 Tasa Oficial BCV (Bs. / USD)</label>
    <input type="number" id="tasaBcv" step="0.01" placeholder="Ej: 36.50" oninput="calcularTotal()">

    <label for="nombre">Nombre y Apellido</label>
    <input type="text" id="nombre" placeholder="Ej: Juan Pérez">

    <label for="telefono">Número de Teléfono</label>
    <input type="tel" id="telefono" placeholder="Ej: 04141234567">

    <label for="fechaInscripcion">📅 Fecha de Inscripción</label>
    <input type="date" id="fechaInscripcion">

    <label for="plan">Seleccionar Plan Base</label>
    <select id="plan" onchange="calcularTotal()">
      <option value="Plan Semanal|10|7">Plan Semanal ($10 - 7 Días)</option>
      <option value="Plan Quincenal|15|15">Plan Quincenal ($15 - 15 Días)</option>
      <option value="Plan Mensual|25|30" selected>Plan Mensual ($25 - 30 Días)</option>
      <option value="Pase Diario|2|1">Pase Diario ($2 - 1 Día)</option>
    </select>

    <div class="checkbox-container" onclick="toggleCheckbox()">
      <input type="checkbox" id="personalizado" onchange="calcularTotal()" onclick="event.stopPropagation()">
      <label for="personalizado">Anexar Plan Personalizado (+$10)</label>
    </div>

    <div class="resumen-pago">
      <p>Total USD: <strong id="resumenUsd">$25</strong></p>
      <p>Total a Cobrar en Bolívares: <strong id="resumenBs" class="monto-bs">Bs. 0.00</strong></p>
    </div>

    <button id="btnGuardar" onclick="agregarOActualizarMiembro()">+ GUARDAR REGISTRO</button>
    <button id="btnCancelar" onclick="cancelarEdicion()" style="display:none; background:#555; margin-top:10px;">CANCELAR EDICIÓN</button>
  </div>

  <!-- LISTA DE CLIENTES -->
  <div class="card">
    <h2>Clientes Registrados</h2>
    <input type="text" id="buscar" placeholder="🔍 Buscar por nombre..." onkeyup="obtenerMiembros()">
    <div id="listaMiembros">
      <p style="color: #888;">Cargando lista...</p>
    </div>
    <button class="btn-borrar" onclick="limpiarTodo()">🔒 Borrar toda la lista (Requiere PIN)</button>
  </div>

  <script>
    // Clave PIN del Administrador para Modificar / Borrar (Cámbiala si lo deseas)
    const PIN_ADMIN = "1234";

    window.onload = function() {
      const hoy = new Date().toISOString().split('T')[0];
      document.getElementById('fechaInscripcion').value = hoy;

      const ultimaTasa = localStorage.getItem('gym_vargas_tasa_bcv');
      if (ultimaTasa) {
        document.getElementById('tasaBcv').value = ultimaTasa;
      }

      calcularTotal();
      obtenerMiembros();
    };

    function toggleCheckbox() {
      const checkbox = document.getElementById('personalizado');
      checkbox.checked = !checkbox.checked;
      calcularTotal();
    }

    function calcularTotal() {
      const planSelect = document.getElementById('plan').value.split('|');
      const esPersonalizado = document.getElementById('personalizado').checked;
      const tasaBcv = parseFloat(document.getElementById('tasaBcv').value) || 0;

      let precioUsd = parseInt(planSelect[1]);
      if (esPersonalizado) {
        precioUsd += 10;
      }

      const totalBs = precioUsd * tasaBcv;

      document.getElementById('resumenUsd').textContent = `$${precioUsd}`;
      document.getElementById('resumenBs').textContent = `Bs. ${totalBs.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

      if (tasaBcv > 0) {
        localStorage.setItem('gym_vargas_tasa_bcv', tasaBcv);
      }
    }

    function agregarOActualizarMiembro() {
      const editId = document.getElementById('editId').value;
      const nombreInput = document.getElementById('nombre');
      const telefonoInput = document.getElementById('telefono');
      const fechaInput = document.getElementById('fechaInscripcion');
      const tasaBcv = parseFloat(document.getElementById('tasaBcv').value) || 0;

      const nombre = nombreInput.value.trim();
      let telefono = telefonoInput.value.trim();
      const fechaSeleccionada = fechaInput.value;
      const planSelect = document.getElementById('plan').value.split('|');
      const esPersonalizado = document.getElementById('personalizado').checked;
      
      if (!nombre) {
        alert("Por favor ingresa el nombre del cliente.");
        return;
      }

      let nombrePlan = planSelect[0];
      let precioBase = parseInt(planSelect[1]);
      let diasDuracion = parseInt(planSelect[2]);
      let precioTotalUsd = precioBase;

      if (esPersonalizado) {
        precioTotalUsd += 10;
        nombrePlan += " + Personalizado";
      }

      const totalBs = precioTotalUsd * tasaBcv;
      const partesFecha = fechaSeleccionada.split('-');
      const fechaInicio = new Date(partesFecha[0], partesFecha[1] - 1, partesFecha[2]);

      const fechaVencimiento = new Date(fechaInicio);
      fechaVencimiento.setDate(fechaInicio.getDate() + diasDuracion);

      let miembros = JSON.parse(localStorage.getItem('gym_vargas_miembros')) || [];

      if (editId) {
        // Modo Edición
        const index = miembros.findIndex(m => m.id == editId);
        if (index !== -1) {
          miembros[index].nombre = nombre;
          miembros[index].telefono = telefono || 'N/A';
          miembros[index].plan = nombrePlan;
          miembros[index].precioUsd = `$${precioTotalUsd}`;
          miembros[index].precioBs = totalBs > 0 ? `Bs. ${totalBs.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})}` : 'N/A';
          miembros[index].tasaUsada = tasaBcv;
          miembros[index].fechaRegistro = fechaInicio.toISOString();
          miembros[index].fechaVencimiento = fechaVencimiento.toISOString();
        }
      } else {
        // Modo Nuevo Registro
        const nuevoMiembro = {
          id: Date.now(),
          nombre: nombre,
          telefono: telefono || 'N/A',
          plan: nombrePlan,
          precioUsd: `$${precioTotalUsd}`,
          precioBs: totalBs > 0 ? `Bs. ${totalBs.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})}` : 'N/A',
          tasaUsada: tasaBcv,
          fechaRegistro: fechaInicio.toISOString(),
          fechaVencimiento: fechaVencimiento.toISOString()
        };
        miembros.unshift(nuevoMiembro);
      }

      localStorage.setItem('gym_vargas_miembros', JSON.stringify(miembros));
      cancelarEdicion();
      obtenerMiembros();
    }

    function editarCliente(id) {
      const pin = prompt("🔒 Ingresa la clave PIN del administrador para modificar:");
      if (pin !== PIN_ADMIN) {
        alert("❌ Clave PIN incorrecta. No tienes permiso para editar.");
        return;
      }

      let miembros = JSON.parse(localStorage.getItem('gym_vargas_miembros')) || [];
      const cliente = miembros.find(m => m.id === id);

      if (cliente) {
        document.getElementById('editId').value = cliente.id;
        document.getElementById('nombre').value = cliente.nombre;
        document.getElementById('telefono').value = cliente.telefono === 'N/A' ? '' : cliente.telefono;
        document.getElementById('fechaInscripcion').value = cliente.fechaRegistro.split('T')[0];

        document.getElementById('tituloFormulario').textContent = "✏️ Modificar Cliente";
        document.getElementById('btnGuardar').textContent = "💾 GUARDAR CAMBIOS";
        document.getElementById('btnCancelar').style.display = "block";

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function cancelarEdicion() {
      document.getElementById('editId').value = '';
      document.getElementById('nombre').value = '';
      document.getElementById('telefono').value = '';
      document.getElementById('personalizado').checked = false;
      document.getElementById('fechaInscripcion').value = new Date().toISOString().split('T')[0];

      document.getElementById('tituloFormulario').textContent = "Registrar Cliente";
      document.getElementById('btnGuardar').textContent = "+ GUARDAR REGISTRO";
      document.getElementById('btnCancelar').style.display = "none";
      calcularTotal();
    }

    function eliminarCliente(id) {
      const pin = prompt("🔒 Ingresa la clave PIN para eliminar este cliente:");
      if (pin !== PIN_ADMIN) {
        alert("❌ Clave PIN incorrecta. No se eliminó el cliente.");
        return;
      }

      let miembros = JSON.parse(localStorage.getItem('gym_vargas_miembros')) || [];
      miembros = miembros.filter(m => m.id !== id);
      localStorage.setItem('gym_vargas_miembros', JSON.stringify(miembros));
      obtenerMiembros();
    }

    function obtenerMiembros() {
      let miembros = JSON.parse(localStorage.getItem('gym_vargas_miembros')) || [];
      const filtro = document.getElementById('buscar').value.toLowerCase();
      const contenedor = document.getElementById('listaMiembros');

      contenedor.innerHTML = '';
      const miembrosFiltrados = miembros.filter(m => m.nombre.toLowerCase().includes(filtro));

      if (miembrosFiltrados.length === 0) {
        contenedor.innerHTML = '<p style="color: #888; padding: 10px;">No se encontraron registros.</p>';
        return;
      }

      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);

      let htmlContenido = '';

      miembrosFiltrados.forEach((m) => {
        const fechaInsc = new Date(m.fechaRegistro);
        const fechaVenc = new Date(m.fechaVencimiento);
        
        const fechaVencNormal = new Date(fechaVenc);
        fechaVencNormal.setHours(0, 0, 0, 0);

        const diferenciaMilisegundos = fechaVencNormal - hoy;
        const diasRestantes = Math.round(diferenciaMilisegundos / (1000 * 60 * 60 * 24));

        let claseAlerta = '';
        let htmlBadge = '';

        if (diasRestantes < 0) {
          claseAlerta = 'alerta-vencido';
          htmlBadge = '<span class="badge-alerta badge-danger">⚠️ MEMBRESÍA VENCIDA</span>';
        } else if (diasRestantes <= 2) {
          claseAlerta = 'alerta-proximo';
          htmlBadge = `<span class="badge-alerta badge-warning">⚡ VENCE EN ${diasRestantes} DÍA(S)</span>`;
        }

        const fechaInscFormateada = fechaInsc.toLocaleDateString('es-ES');
        const fechaVencFormateada = fechaVenc.toLocaleDateString('es-ES');
        
        let tlfLimpio = m.telefono.replace(/\D/g, '');
        if (tlfLimpio.startsWith('0')) {
          tlfLimpio = '58' + tlfLimpio.substring(1);
        }

        const textoWS = encodeURIComponent(`Hola ${m.nombre}! Te saludamos de Gym Vargas Machine 💪🏼. Te recordamos que tu membresía (${m.plan}) está próxima a vencer el ${fechaVencFormateada}. ¡Te esperamos para seguir entrenando!`);
        const urlWS = `https://wa.me/${tlfLimpio}?text=${textoWS}`;

        const btnWhatsApp = (m.telefono !== 'N/A' && tlfLimpio.length >= 10) 
          ? `<a href="${urlWS}" target="_blank" class="btn-ws" title="Enviar WhatsApp">💬</a>` 
          : '';

        htmlContenido += `
          <div class="miembro-card ${claseAlerta}">
            <div class="miembro-info">
              <strong>${m.nombre}</strong>
              <span>${m.plan}</span>
              <small>Inscrito: ${fechaInscFormateada} • Vence: ${fechaVencFormateada}</small>
              <small>Tlf: ${m.telefono}</small>
              ${htmlBadge}
            </div>
            <div class="acciones-container">
              <div class="monto-box">
                <span class="monto-tag">${m.precioUsd}</span>
                <span class="monto-sub-bs">${m.precioBs}</span>
              </div>
              ${btnWhatsApp}
              <button class="btn-editar" onclick="editarCliente(${m.id})">✏️</button>
              <button class="btn-eliminar-item" onclick="eliminarCliente(${m.id})">❌</button>
            </div>
          </div>
        `;
      });

      contenedor.innerHTML = htmlContenido;
    }

    function limpiarTodo() {
      const pin = prompt("🔒 Ingresa la clave PIN para borrar TODA la lista:");
      if (pin !== PIN_ADMIN) {
        alert("❌ Clave PIN incorrecta. Acción cancelada.");
        return;
      }

      if (confirm("¿Estás 100% seguro de vaciar toda la lista?")) {
        localStorage.removeItem('gym_vargas_miembros');
        obtenerMiembros();
      }
    }
  </script>
</body>
</html>
